[package]
name = "headless-luau"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
rove-client-core = { path = "../client-core", features = ["transport"] }
mimalloc = { version = "=0.1.52", optional = true, default-features = false }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
serde = { version = "=1.0.229", features = ["derive"] }
base64 = "=0.22.1"
blake2 = "=0.10.6"
blake3 = "=1.8.7"
md-5 = "=0.10.6"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
ureq = "=2.9.7"
tungstenite = { version = "=0.29.0", features = ["native-tls"] }
url = "=2.5.8"
unicode-segmentation = "=1.13.3"
libc = "=0.2.191"
tokio = { version = "=1.50.0", features = ["rt", "net", "time"] }

[features]
default = []
allocator-mimalloc = ["dep:mimalloc"]
allocator-mimalloc-native = ["allocator-mimalloc", "mimalloc/override"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-text = { version = "=0.3.2", default-features = false, features = ["CTFont", "CTFontDescriptor", "CTFontManager", "CTLine", "CTStringAttributes"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFArray", "CFAttributedString", "CFCGTypes", "CFDictionary", "CFString", "CFURL"] }

[profile.release]
lto = "thin"
strip = true
